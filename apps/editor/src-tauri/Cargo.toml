[package]
name = "md-render"
# 应用版本由 tauri.conf.json 指向 apps/editor/package.json；这里仅是内部 Rust crate 版本。
version = "0.1.0"
description = "Tauri desktop app for MD Render"
authors = ["canace22"]
edition = "2021"

[lib]
name = "md_render_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled-full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
