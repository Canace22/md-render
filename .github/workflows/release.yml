name: Release Desktop (Electron)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: 校验发布版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate version and release commit
        id: release
        shell: bash
        run: |
          root_version="$(node -p "require('./package.json').version")"
          editor_version="$(node -p "require('./apps/editor/package.json').version")"
          if [[ "$root_version" != "$editor_version" ]]; then
            echo "Root and editor versions differ: $root_version != $editor_version" >&2
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$root_version" ]]; then
            echo "Tag and package versions differ: $tag_version != $root_version" >&2
            exit 1
          fi

          git fetch origin main:refs/remotes/origin/main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit on origin/main." >&2
            exit 1
          fi

          echo "version=$root_version" >> "$GITHUB_OUTPUT"

      - name: Validate optional AI proxy
        shell: bash
        env:
          AI_PROXY_BASE: ${{ vars.AI_PROXY_BASE }}
        run: |
          if [[ -n "$AI_PROXY_BASE" && "$AI_PROXY_BASE" != https://* ]]; then
            echo "Repository variable AI_PROXY_BASE must use HTTPS for a production build." >&2
            exit 1
          fi
          if [[ -z "$AI_PROXY_BASE" ]]; then
            echo "::warning::AI_PROXY_BASE is unset; users must configure an AI proxy in the app."
          fi

  release-macos:
    name: macOS Universal 发布包
    needs: validate-release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install mcp-bridge dependencies
        run: npm ci --prefix server/mcp-bridge

      - name: Build Electron app
        run: pnpm electron:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          VITE_AI_PROXY: ${{ vars.AI_PROXY_BASE }}

      - name: Check build output
        shell: bash
        run: |
          release_dir="apps/editor/release"
          test -d "$release_dir"
          find "$release_dir" -maxdepth 2 -type d -name 'MD Render.app' -print -quit | grep -q .
          ls "$release_dir"/MD-Render-*.dmg >/dev/null
          ls "$release_dir"/*.zip >/dev/null
          test -f "$release_dir/latest-mac.yml"
          ls "$release_dir"/*.blockmap >/dev/null

      - name: Create macOS checksums
        shell: bash
        run: |
          cd apps/editor/release
          shasum -a 256 MD-Render-*.dmg *.zip > SHA256SUMS-macos.txt

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            apps/editor/release/MD-Render-*.dmg
            apps/editor/release/*.zip
            apps/editor/release/*.blockmap
            apps/editor/release/latest-mac.yml
            apps/editor/release/SHA256SUMS-macos.txt
          if-no-files-found: error
          retention-days: 14

  release-windows:
    name: Windows x64 发布包
    needs: validate-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install mcp-bridge dependencies
        run: npm ci --prefix server/mcp-bridge

      - name: Build Electron app
        run: pnpm electron:build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          VITE_AI_PROXY: ${{ vars.AI_PROXY_BASE }}

      - name: Check build output
        shell: pwsh
        run: |
          $releaseDir = 'apps/editor/release'
          if (!(Test-Path $releaseDir)) {
            throw 'release directory not found'
          }
          if (!(Test-Path "$releaseDir/latest.yml")) {
            throw 'latest.yml not found (auto update needs it)'
          }
          $installers = @(Get-ChildItem "$releaseDir/MD-Render-Setup-*.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one installer, found $($installers.Count)."
          }
          if ((Get-ChildItem "$releaseDir/*.blockmap").Count -eq 0) {
            throw 'blockmap not found (auto update needs it)'
          }

      - name: Create Windows checksums
        shell: pwsh
        run: |
          $releaseDir = 'apps/editor/release'
          $installer = Get-ChildItem "$releaseDir/MD-Render-Setup-*.exe" | Select-Object -First 1
          $hash = Get-FileHash -Algorithm SHA256 $installer.FullName
          "$($hash.Hash.ToLowerInvariant())  $($installer.Name)" |
            Set-Content -Encoding ascii "$releaseDir/SHA256SUMS-windows.txt"

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            apps/editor/release/MD-Render-Setup-*.exe
            apps/editor/release/*.blockmap
            apps/editor/release/latest.yml
            apps/editor/release/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: 发布 GitHub Release
    needs: [validate-release, release-macos, release-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release files
        run: ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## 下载

            - **macOS**：下载 `.dmg` 文件（Universal，支持 Intel 与 Apple Silicon）
            - **Windows**：下载 `.exe` 安装包（x64）

            ## macOS 安装说明

            CI 构建未做 Apple 代码签名。若系统提示「应用程序已损坏，无法打开」：

            1. 打开 **系统设置 → 隐私与安全性**，点击「仍要打开」；或
            2. 在终端执行（路径按实际安装位置调整）：

            ```bash
            xattr -dr com.apple.quarantine "/Applications/MD Render.app"
            ```

            ## Windows 安装说明

            安装包未做代码签名。若 Windows Defender SmartScreen 弹出警告，点击「更多信息 → 仍要运行」即可。

            网页版见仓库 **Deployments → github-pages** 或 README 中的 Pages 链接。
